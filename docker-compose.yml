services:
  discovery:
    build:
      context: .
      target: discovery
    init: true
    restart: unless-stopped
    ports:
      - "${DISCOVERY_PORT:-4000}:4000"
    environment:
      PORT: "4000"
      PUBLIC_URL: "${PUBLIC_DISCOVERY_URL:-}"
      PUBLIC_HOST: "${PUBLIC_HOST:-}"
      ALLOW_ADVERTISE: "1"
      TRUST_PROXY: "${TRUST_PROXY:-0}"
      DISCOVERY_TOKEN: "${DISCOVERY_TOKEN:-}"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build:
      context: .
      target: web
    init: true
    restart: unless-stopped
    depends_on:
      discovery:
        condition: service_healthy
    ports:
      # UI stays local to the Docker host. Use an SSH tunnel for a remote host.
      - "127.0.0.1:${UI_PORT:-3333}:3333"
      # Solid-OIDC browser callback stays local to the Docker host.
      - "127.0.0.1:${OIDC_CALLBACK_PORT:-3888}:${OIDC_CALLBACK_PORT:-3888}"
      # Public P2P listener. Forward this port on the router for cross-network chat.
      - "${P2P_PORT:-5000}:${P2P_LISTEN_PORT:-5000}"
    volumes:
      - p2pod-data:/data
    environment:
      P2POD_UI_HOST: "0.0.0.0"
      P2POD_UI_PORT: "3333"
      P2POD_OIDC_CALLBACK_HOST: "0.0.0.0"
      P2POD_OIDC_CALLBACK_PORT: "${OIDC_CALLBACK_PORT:-3888}"
      P2POD_HOME: "/data/profile"
      P2POD_DATA_DIR: "/data/profiles"
      P2POD_STATE_DIR: "/data/state"
      P2POD_CSS_DIR: "/data/css"
      P2P_DISCOVERY_URL: "${DISCOVERY_URL:-http://discovery:4000}"
      P2P_PUBLIC_HOST: "${PUBLIC_HOST:-}"
      P2P_PUBLIC_PORT: "${P2P_PORT:-5000}"
      P2P_LISTEN_PORT: "${P2P_LISTEN_PORT:-5000}"
      P2P_DISCOVERY_TOKEN: "${DISCOVERY_TOKEN:-}"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3333/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  p2pod-data: